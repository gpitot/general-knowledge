name: Deploy to GitHub Pages

on:
  push:
    # main publishes the site root; every other branch publishes a preview
    # under /preview/<branch>/ so changes can be reviewed before merging.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

# One in-flight deploy per branch, so main and preview pushes don't clobber
# each other's commits to the gh-pages branch.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: ${{ github.ref_name == 'main' && '.' || format('preview/{0}', github.ref_name) }}
          # Keep the root site when deploying previews, and vice versa.
          keep_files: true
          force_orphan: false
